name: Build Feather iOS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/feather-build.yml'
      - 'FEATHER_BUILD.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Clone Feather
        run: |
          git clone --recursive https://github.com/claration/feather.git FeatherSource
          cd FeatherSource
          git checkout 4db3efff0b12dd2ed1ad424edfc4365164fdefc3
          git submodule update --init --recursive

      - name: Select Xcode
        run: |
          ls /Applications | grep '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
          xcodebuild -version

      - name: Build Feather for iPhoneOS
        working-directory: FeatherSource
        run: |
          set -o pipefail
          make iphoneos | tee ../feather-build.log

      - name: Collect IPA
        run: |
          test -f FeatherSource/packages/Feather.ipa
          cp FeatherSource/packages/Feather.ipa Feather-2.9.0-ui.ipa
          shasum -a 256 Feather-2.9.0-ui.ipa | tee Feather-2.9.0-ui.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-2.9.0-ui
          path: |
            Feather-2.9.0-ui.ipa
            Feather-2.9.0-ui.sha256
            feather-build.log
